[project]
name = "finsearch"
version = "0.1.0"
description = "Harness for the OpenBenchmarks finance search benchmark: a fixed agent and grader, with the search API as the only variable."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "openai>=2.50,<3",
  "anthropic>=0.121,<1",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "huggingface_hub>=0.30",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finsearch = "harness.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "judge"]
exclude = ["harness/tests", "judge/tests"]

[tool.hatch.build.targets.wheel.force-include]
"tools" = "tools"

[tool.pytest.ini_options]
testpaths = ["harness/tests", "judge/tests"]
